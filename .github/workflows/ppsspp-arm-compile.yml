name: PPSSPP interpreter ARM cross-compile probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ppsspp-arm-compile.yml'
      - 'scripts/fetch-ppsspp-upstream.sh'
      - 'scripts/patch-ppsspp-vfpu-types.py'
permissions:
  contents: read
jobs:
  arm-interpreter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkitarm:20260610
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned PPSSPP source
        shell: bash
        run: |
          bash scripts/fetch-ppsspp-upstream.sh
          git -C vendor/ppsspp sparse-checkout add ext/libzip ext/cityhash Core/Util Core/Debugger
          test -f vendor/ppsspp/ext/libzip/zip.h
          test -f vendor/ppsspp/ext/cityhash/city.h
          test "$(git -C vendor/ppsspp rev-parse HEAD)" = "1aebad2c651ff9d0684ee335e43aceff8fc7e3ec"
      - name: Apply narrow VFPU register pointer compatibility patch
        shell: bash
        run: |
          set -eu
          python3 scripts/patch-ppsspp-vfpu-types.py vendor/ppsspp
      - name: Attempt real ARM interpreter translation-unit compilation
        shell: bash
        run: |
          set -eu
          mkdir -p build/ppsspp-arm
          # Compile independent translation units concurrently, preserving per-unit logs.
          units=(Core/MIPS/Interpreter.cpp Core/MIPS/InterpreterDispatch.cpp Core/MIPS/InterpreterVFPU.cpp Core/MIPS/MIPSVFPUUtils.cpp Core/MIPS/MIPSDis.cpp Core/MIPS/MIPSDisVFPU.cpp Core/MIPS/MIPS.cpp Core/MIPS/MIPSAnalyst.cpp Core/MIPS/MIPSTables.cpp Core/MIPS/MIPSCodeUtils.cpp)
          pids=()
          for unit in "${units[@]}"; do
            name="$(basename "$unit" .cpp)"
            echo "Compiling upstream $unit with ARM C++ compiler"
            (
              if "$DEVKITARM/bin/arm-none-eabi-g++" -std=c++17 -O2 -marm -mcpu=mpcore -mfpu=vfp -mfloat-abi=softfp \
                  -Ivendor/ppsspp -c "vendor/ppsspp/$unit" \
                  -o "build/ppsspp-arm/$name.o" \
                  > "build/ppsspp-arm/$name.log" 2>&1; then
                printf '%s\tcompiled\n' "$unit" > "build/ppsspp-arm/$name.status"
              else
                printf '%s\tblocked\n' "$unit" > "build/ppsspp-arm/$name.status"
              fi
            ) &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          : > build/ppsspp-arm/status.tsv
          for unit in "${units[@]}"; do
            name="$(basename "$unit" .cpp)"
            cat "build/ppsspp-arm/$name.status" >> build/ppsspp-arm/status.tsv
            if grep -q 'blocked' "build/ppsspp-arm/$name.status"; then
              sed -n '1,50p' "build/ppsspp-arm/$name.log"
            fi
          done
          cat build/ppsspp-arm/status.tsv
          # This is a diagnostic cross-compile, NOT a PSP runtime link or game boot.
          # Preserve all compiler failures as artifacts for the integration batch.
          test "$(wc -l < build/ppsspp-arm/status.tsv)" -eq 10
          # A blocked compiler unit is a failed integration gate, not a green build.
          if grep -q 'blocked' build/ppsspp-arm/status.tsv; then
            echo 'FAIL: upstream PPSSPP ARM compile blockers remain' >&2
            exit 1
          fi
          test "$(find build/ppsspp-arm -name '*.o' | wc -l)" -eq 10
      - name: Cross-compile portable PSP3DS guest memory backend
        shell: bash
        run: |
          set -eu
          mkdir -p build/guest-memory-arm
          for unit in psp_guest_window psp_guest_bus; do
            "$DEVKITARM/bin/arm-none-eabi-gcc" -std=c11 -O2 -Wall -Wextra -Werror \
              -marm -mcpu=mpcore -Iinclude -c "source/${unit}.c" \
              -o "build/guest-memory-arm/${unit}.o"
            test -s "build/guest-memory-arm/${unit}.o"
          done
          # These are independent portable memory objects, NOT yet PPSSPP Memory::.
          "$DEVKITARM/bin/arm-none-eabi-readelf" -h build/guest-memory-arm/psp_guest_bus.o \
            > build/guest-memory-arm/elf-header.txt
          grep -q "Machine:.*ARM" build/guest-memory-arm/elf-header.txt
      - name: Combine real PPSSPP ARM objects into relocatable link unit
        shell: bash
        run: |
          set -eu
          "$DEVKITARM/bin/arm-none-eabi-g++" -nostdlib -Wl,-r \
            -o build/ppsspp-arm/ppsspp-interpreter-relocatable.o \
            build/ppsspp-arm/Interpreter.o \
            build/ppsspp-arm/InterpreterDispatch.o \
            build/ppsspp-arm/InterpreterVFPU.o \
            build/ppsspp-arm/MIPSVFPUUtils.o \
            build/ppsspp-arm/MIPSDis.o \
            build/ppsspp-arm/MIPSDisVFPU.o \
            build/ppsspp-arm/MIPS.o \
            build/ppsspp-arm/MIPSAnalyst.o \
            build/ppsspp-arm/MIPSTables.o \
            build/ppsspp-arm/MIPSCodeUtils.o
          test -s build/ppsspp-arm/ppsspp-interpreter-relocatable.o
          "$DEVKITARM/bin/arm-none-eabi-nm" -u -C \
            build/ppsspp-arm/ppsspp-interpreter-relocatable.o \
            > build/ppsspp-arm/relocatable-unresolved.txt
          # -r intentionally permits undefined symbols. NOT an executable link.
          "$DEVKITARM/bin/arm-none-eabi-readelf" -h \
            build/ppsspp-arm/ppsspp-interpreter-relocatable.o \
            > build/ppsspp-arm/relocatable-elf-header.txt
          grep -q "Machine:.*ARM" build/ppsspp-arm/relocatable-elf-header.txt
          grep -q "Type:.*REL" build/ppsspp-arm/relocatable-elf-header.txt
      - name: Link interpreter and portable guest memory as integration probe
        shell: bash
        run: |
          set -eu
          "$DEVKITARM/bin/arm-none-eabi-g++" -nostdlib -Wl,-r \
            -o build/ppsspp-arm/interpreter-with-guest-bus-relocatable.o \
            build/ppsspp-arm/ppsspp-interpreter-relocatable.o \
            build/guest-memory-arm/psp_guest_window.o \
            build/guest-memory-arm/psp_guest_bus.o
          "$DEVKITARM/bin/arm-none-eabi-readelf" -h \
            build/ppsspp-arm/interpreter-with-guest-bus-relocatable.o \
            > build/ppsspp-arm/integration-elf-header.txt
          grep -q "Machine:.*ARM" build/ppsspp-arm/integration-elf-header.txt
          grep -q "Type:.*REL" build/ppsspp-arm/integration-elf-header.txt
          "$DEVKITARM/bin/arm-none-eabi-nm" -C \
            build/ppsspp-arm/interpreter-with-guest-bus-relocatable.o \
            > build/ppsspp-arm/integration-symbols.txt
          grep -q ' T psp_guest_bus_read32
        shell: bash
        run: |
          set -eu
          "$DEVKITARM/bin/arm-none-eabi-nm" -u -C build/ppsspp-arm/ppsspp-interpreter-relocatable.o > build/ppsspp-arm/unresolved-symbols.txt
          "$DEVKITARM/bin/arm-none-eabi-nm" -C build/ppsspp-arm/ppsspp-interpreter-relocatable.o > build/ppsspp-arm/all-symbols.txt
          python3 scripts/audit-ppsspp-link-closure.py \
            build/ppsspp-arm/unresolved-symbols.txt \
            build/ppsspp-arm/all-symbols.txt \
            --output build/ppsspp-arm/link-closure.json
          cat build/ppsspp-arm/link-closure.json
          python3 scripts/summarize-ppsspp-link-deps.py \
            build/ppsspp-arm/unresolved-symbols.txt \
            --output build/ppsspp-arm/dependency-categories.json
          cat build/ppsspp-arm/dependency-categories.json
          # A dependency inventory is not proof of successful linking.
      - name: Publish cross-compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-arm-interpreter-compile-evidence
          path: |
            build/ppsspp-arm/*.log
            build/ppsspp-arm/status.tsv
            build/ppsspp-arm/*.o
            build/ppsspp-arm/*symbols.txt
            build/ppsspp-arm/link-closure.json
            build/ppsspp-arm/dependency-categories.json
            build/ppsspp-arm/relocatable-elf-header.txt
            build/ppsspp-arm/relocatable-unresolved.txt
            build/guest-memory-arm/*.o
            build/guest-memory-arm/elf-header.txt
            build/ppsspp-arm/integration-elf-header.txt
            build/ppsspp-arm/integration-symbols.txt
          if-no-files-found: warn
 build/ppsspp-arm/integration-symbols.txt
          grep -q ' T psp_guest_bus_write32
        shell: bash
        run: |
          set -eu
          "$DEVKITARM/bin/arm-none-eabi-nm" -u -C build/ppsspp-arm/ppsspp-interpreter-relocatable.o > build/ppsspp-arm/unresolved-symbols.txt
          "$DEVKITARM/bin/arm-none-eabi-nm" -C build/ppsspp-arm/ppsspp-interpreter-relocatable.o > build/ppsspp-arm/all-symbols.txt
          python3 scripts/audit-ppsspp-link-closure.py \
            build/ppsspp-arm/unresolved-symbols.txt \
            build/ppsspp-arm/all-symbols.txt \
            --output build/ppsspp-arm/link-closure.json
          cat build/ppsspp-arm/link-closure.json
          python3 scripts/summarize-ppsspp-link-deps.py \
            build/ppsspp-arm/unresolved-symbols.txt \
            --output build/ppsspp-arm/dependency-categories.json
          cat build/ppsspp-arm/dependency-categories.json
          # A dependency inventory is not proof of successful linking.
      - name: Publish cross-compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-arm-interpreter-compile-evidence
          path: |
            build/ppsspp-arm/*.log
            build/ppsspp-arm/status.tsv
            build/ppsspp-arm/*.o
            build/ppsspp-arm/*symbols.txt
            build/ppsspp-arm/link-closure.json
            build/ppsspp-arm/dependency-categories.json
            build/ppsspp-arm/relocatable-elf-header.txt
            build/ppsspp-arm/relocatable-unresolved.txt
            build/guest-memory-arm/*.o
            build/guest-memory-arm/elf-header.txt
          if-no-files-found: warn
 build/ppsspp-arm/integration-symbols.txt
          # Relocatable link proves object compatibility, not runtime memory wiring.
      - name: Inventory ARM interpreter link dependencies
        shell: bash
        run: |
          set -eu
          "$DEVKITARM/bin/arm-none-eabi-nm" -u -C build/ppsspp-arm/ppsspp-interpreter-relocatable.o > build/ppsspp-arm/unresolved-symbols.txt
          "$DEVKITARM/bin/arm-none-eabi-nm" -C build/ppsspp-arm/ppsspp-interpreter-relocatable.o > build/ppsspp-arm/all-symbols.txt
          python3 scripts/audit-ppsspp-link-closure.py \
            build/ppsspp-arm/unresolved-symbols.txt \
            build/ppsspp-arm/all-symbols.txt \
            --output build/ppsspp-arm/link-closure.json
          cat build/ppsspp-arm/link-closure.json
          python3 scripts/summarize-ppsspp-link-deps.py \
            build/ppsspp-arm/unresolved-symbols.txt \
            --output build/ppsspp-arm/dependency-categories.json
          cat build/ppsspp-arm/dependency-categories.json
          # A dependency inventory is not proof of successful linking.
      - name: Publish cross-compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-arm-interpreter-compile-evidence
          path: |
            build/ppsspp-arm/*.log
            build/ppsspp-arm/status.tsv
            build/ppsspp-arm/*.o
            build/ppsspp-arm/*symbols.txt
            build/ppsspp-arm/link-closure.json
            build/ppsspp-arm/dependency-categories.json
            build/ppsspp-arm/relocatable-elf-header.txt
            build/ppsspp-arm/relocatable-unresolved.txt
            build/guest-memory-arm/*.o
            build/guest-memory-arm/elf-header.txt
          if-no-files-found: warn
