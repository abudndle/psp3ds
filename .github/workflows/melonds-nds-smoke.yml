name: PSP3DS melonDS NDS smoke test
on:
  pull_request:
    paths:
      - 'platforms/nds/**'
      - 'source/psp_benchmark.c'
      - 'include/psp_benchmark.h'
      - 'scripts/capture_melonds_ci.sh'
      - '.github/workflows/melonds-nds-smoke.yml'
  push:
    branches: [main, port/ppsspp-interpreter-probe]
    paths:
      - 'platforms/nds/**'
      - 'source/**'
      - 'include/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/melonds-nds-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: psp3ds-melonds-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nds:
    runs-on: ubuntu-latest
    container:
      image: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual DS homebrew
        run: bash scripts/build_nds.sh
      - name: Upload tested NDS
        uses: actions/upload-artifact@v4
        with:
          name: melonds-test-nds
          path: build-nds/psp3ds_nds.nds
          if-no-files-found: error
  melonds:
    needs: nds
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: melonds-test-nds
          path: melonds-test
      - name: Install X11 screenshot and emulator runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11-utils x11-apps xdotool imagemagick python3-pil file libopengl0 libgl1 libegl1 libxkbcommon-x11-0
      - name: Download pinned official melonDS 1.1 Linux release
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://github.com/melonDS-emu/melonDS/releases/download/1.1/melonDS-1.1-appimage-x86_64.zip' \
            --output melonds-release.zip
          python3 - <<'PY'
          import pathlib, zipfile, os
          with zipfile.ZipFile('melonds-release.zip') as z:
              apps=[m for m in z.infolist() if not m.is_dir() and m.filename.endswith('.AppImage')]
              if len(apps)!=1:
                  raise SystemExit('Pinned release ZIP lacks one Linux AppImage')
              executable=pathlib.Path('melonDS.AppImage')
              executable.write_bytes(z.read(apps[0]))
          executable.chmod(0o755)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('MELONDS_EXE='+str(executable.resolve())+'\n')
          PY
          test -s melonDS.AppImage
      - name: Launch NDS in actual melonDS and capture visible window
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          mkdir -p melonds-evidence
          timeout 100 xvfb-run -a -s '-screen 0 1280x960x24' bash scripts/capture_melonds_ci.sh melonds-test/psp3ds_nds.nds melonds-evidence/melonds-window.png
      - name: Attempt official melonDS emulated Slot-2 Memory expansion
        env:
          QT_QPA_PLATFORM: xcb
          MELONDS_SLOT2_EXPANSION: '1'
        run: |
          mkdir -p melonds-expansion
          timeout 100 xvfb-run -a -s '-screen 0 1280x960x24' bash scripts/capture_melonds_ci.sh melonds-test/psp3ds_nds.nds melonds-expansion/melonds-expansion.png
      - name: Include source ROM hash and evidence notes
        if: always()
        run: |
          mkdir -p melonds-evidence
          sha256sum melonds-test/psp3ds_nds.nds > melonds-evidence/rom.sha256
          printf '%s\n' 'This is a real emulator-window capture only; it does not prove guest instruction execution, Slot-2 Pak behavior, or Jetpack Joyride gameplay.' > melonds-evidence/README.txt
      - name: Upload actual emulator screenshot or failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melonds-nds-window-or-diagnostics
          path: |
            melonds-evidence/
            melonds-expansion/
          if-no-files-found: error
