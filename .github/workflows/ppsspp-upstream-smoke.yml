name: PPSSPP upstream source integration smoke
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-ppsspp-upstream.sh'
      - '.github/workflows/ppsspp-upstream-smoke.yml'
      - 'scripts/audit-ppsspp-mips.py'
      - 'scripts/audit-ppsspp-transitive.py'
      - 'scripts/summarize-ppsspp-link-deps.py'
      - 'scripts/audit-ppsspp-link-closure.py'
      - 'tests/test_ppsspp_link_deps.py'
      - 'tests/test_ppsspp_link_closure.py'
permissions:
  contents: read
jobs:
  upstream-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test PPSSPP linker report parser
        run: |
          python3 tests/test_ppsspp_link_deps.py
          python3 tests/test_ppsspp_link_closure.py
      - name: Fetch pinned real PPSSPP sources
        run: bash scripts/fetch-ppsspp-upstream.sh
      - name: Validate source directories and pinned revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor/ppsspp rev-parse HEAD)" = "1aebad2c651ff9d0684ee335e43aceff8fc7e3ec"
          for dir in libretro Common Core/MIPS Core/HLE Core/HW GPU Core/FileSystems Core/FileLoaders; do
            test -d "vendor/ppsspp/$dir"
            test -n "$(find "vendor/ppsspp/$dir" -type f -print -quit)"
          done
          test -f vendor/ppsspp/LICENSE.TXT || test -f vendor/ppsspp/LICENSE
          echo "Pinned PPSSPP source checkout verified (not yet compiled into PSP3DS)"
      - name: Audit upstream MIPS interpreter dependencies
        run: python3 scripts/audit-ppsspp-mips.py vendor/ppsspp
      - name: Inventory transitive interpreter headers
        run: python3 scripts/audit-ppsspp-transitive.py vendor/ppsspp
      - name: Compile upstream MIPS interpreter translation units to objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/upstream-mips
          for file in Core/MIPS/Interpreter.cpp Core/MIPS/InterpreterDispatch.cpp Core/MIPS/MIPSCodeUtils.cpp; do
            echo "Checking $file"
            g++ -std=c++17 -c -Ivendor/ppsspp "vendor/ppsspp/$file" -o "build/upstream-mips/$(basename "$file" .cpp).o"
          done
          test "$(find build/upstream-mips -name '*.o' | wc -l)" -eq 3
          file build/upstream-mips/*.o
          # A source compilation alone does not prove these objects can link.
          # Record unresolved symbols to guide the actual integration work.
          nm -u -C build/upstream-mips/*.o > build/upstream-mips/unresolved-symbols.txt
          nm -C build/upstream-mips/*.o > build/upstream-mips/all-symbols.txt
          python3 scripts/audit-ppsspp-link-closure.py \
            build/upstream-mips/unresolved-symbols.txt \
            build/upstream-mips/all-symbols.txt \
            --output build/upstream-mips/link-closure.json
          cat build/upstream-mips/link-closure.json
          test -s build/upstream-mips/unresolved-symbols.txt
          # Attempt an actual link: compiling object files is not integration.
          # Expected to fail until PPSSPP's transitive dependencies are wired.
          cat > build/upstream-mips/link-probe.cpp <<'EOF'
          int main() { return 0; }
          EOF
          if g++ -std=c++17 -o build/upstream-mips/link-probe \
              build/upstream-mips/link-probe.cpp build/upstream-mips/*.o \
              > build/upstream-mips/link-probe.log 2>&1; then
            echo "PPSSPP MIPS host link probe passed"
          else
            echo "PPSSPP MIPS host link probe blocked; see artifact"
            head -n 40 build/upstream-mips/link-probe.log
          fi
          python3 scripts/summarize-ppsspp-link-deps.py \
            build/upstream-mips/unresolved-symbols.txt \
            --output build/upstream-mips/dependency-summary.json
          cat build/upstream-mips/dependency-summary.json
          echo "Upstream PPSSPP interpreter dependencies (first 60):"
          head -n 60 build/upstream-mips/unresolved-symbols.txt
          echo "Upstream objects compiled for Linux host only; not linked or built for Nintendo hardware."
      - name: Publish upstream integration dependency inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-mips-link-dependencies
          path: |
            build/upstream-mips/unresolved-symbols.txt
            build/upstream-mips/link-probe.log
            build/upstream-mips/dependency-summary.json
            build/upstream-mips/link-closure.json
          if-no-files-found: warn
